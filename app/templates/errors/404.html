{% extends "base.html" %}

{% block title %}404 Not Found — StockPulse{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-primary fw-bold mb-3"><i class="bi bi-question-circle-fill"></i> 404</div>
        <h2 class="fw-bold mb-2">Resource Not Found</h2>
        <p class="text-muted mb-4">
            The requested product, catalog entry, or inventory route does not exist or has been relocated.
        </p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
